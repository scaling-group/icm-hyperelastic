[workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"


[feature.fenics]
dependencies = { fenics = ">=2019.1.0,<2020", imageio = ">=2.37.0,<3", meshio = ">=5.3.5,<6" }


[feature.cu11]
system-requirements = { cuda = "11.8" }

[feature.cu11.pypi-dependencies]
torch = { version = ">=2.7.0,<3", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { version = ">=0.22.0,<1", index = "https://download.pytorch.org/whl/cu118" }
lightning = { version = ">=2.5.0,<3" }


[feature.cu12]
system-requirements = { cuda = "12.6" }

[feature.cu12.pypi-dependencies]
torch = { version = ">=2.7.0,<3", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = ">=0.24.0,<1", index = "https://download.pytorch.org/whl/cu126" }
lightning = { version = ">=2.5.0,<3" }


[feature.cpu.pypi-dependencies]
torch = { version = ">=2.7.0,<3", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.24.0,<1", index = "https://download.pytorch.org/whl/cpu" }
lightning = { version = ">=2.5.0,<3" }


[environments]
cpu = { features = ["cpu"] }
cu11 = { features = ["cu11"] }
cu12 = { features = ["cu12"] }
fem-cu11 = { features = ["cu11", "fenics"] }
fem-cu12 = { features = ["cu12", "fenics"] }

default = { features = ["cu12"] }

[pypi-dependencies]
einops = ">=0.8.2, <0.9"
frozendict = ">=2.4.7, <3"
h5py = ">=3.15.1, <4"
hydra-core = ">=1.3.2, <2"
hydra-colorlog = ">=1.2.0, <2"
ipykernel = ">=7.2.0, <8"
matplotlib = ">=3.10.8, <4"
mlflow = ">=3.10.0, <4"
neuraloperator = ">=2.0.0, <3"
numpy = ">=2.4.2, <3"
optree = ">=0.19.0, <0.20"
pandas = ">=2.3.3, <3"
rich = ">=14.3.3, <15"
rootutils = ">=1.0.7, <2"
seaborn = ">=0.13.2, <0.14"
tabulate = ">=0.9.0, <0.10"
transformers = ">=5.2.0, <6"
wandb = ">=0.25.0, <0.26"
